server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: test-secret-key-must-be-at-least-64-chars-long-for-hs256-tests-only-please
    access-ttl: 900
    refresh-ttl: 604800

logging:
  level:
    com.novaathletics: DEBUG
    org.hibernate.SQL: WARN
